name: monitor-turismomujer

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar página
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          URL="https://turismomujer.sernatur.cl/"
          curl -sL --max-time 30 -A "Mozilla/5.0" -o page.html "$URL" || exit 0
          [ -s page.html ] || exit 0

          if grep -q "xxxx" page.html; then
            now="vacio"
          else
            now="hay_destinos"
          fi

          prev=$(cat state.txt 2>/dev/null || true)
          if [ "$now" != "$prev" ]; then
            echo "$now" > state.txt
            if [ "$now" = "hay_destinos" ]; then
              curl -s "https://api.telegram.org/bot$TOKEN/sendMessage" \
                -d chat_id="$CHAT_ID" \
                -d text="🎉 Turismo Mujer cargó destinos: $URL" >/dev/null
            fi
            git config user.name "monitor-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state.txt
            git commit -m "estado: $now"
            git push
          fi
